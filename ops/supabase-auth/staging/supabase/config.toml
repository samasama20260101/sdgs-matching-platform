# Staging(fzawgdmqewmwdqjsqjwt)の Auth のうち、v2.0 で決めて持つ項目だけ(#72)。
# ここに書いた項目だけが書き換わり、書いていない項目(site_url など)はそのまま残る。
#   npx supabase config diff --workdir ops/supabase-auth/staging --remote=fzawgdmqewmwdqjsqjwt
#   npx supabase config push --workdir ops/supabase-auth/staging --remote=fzawgdmqewmwdqjsqjwt --yes
project_id = "sdgs-staging"

[auth]
# Workers の Staging(切り替えたら)と Vercel の Staging、手元の開発に戻れるようにする
additional_redirect_urls = [
  "https://sdgs-matching-platform-git-dev-samasama.vercel.app/**",
  "https://samasama-app-staging.samasama.workers.dev/**",
  "http://localhost:3000/**",
]

[auth.email]
# パスワードを持たず、メールに届く 6 けたのコードで入る(キャンバス盤 11)
otp_length = 6
otp_expiry = 600
# メールアドレスの変更(#155)は、新しいアドレスに届くコードだけで確定する。古いアドレスでは確かめない
# (退職などで古いアドレスを使えなくなった人が変えられるように。2026-11-23 運営了承)。変わったことは古いアドレスに知らせる
double_confirm_changes = false

[auth.email.smtp]
# ログインのコードなど Auth のメールを、Cloudflare Email Sending の SMTP から samasama.site の名前で送る(#166、2026-11-26。
# それまでは Resend のチーム ocn)。Cloudflare の SMTP は 465 の暗黙の TLS だけで、ユーザー名は文字どおり api_token。
# パスワードは samasama のアカウントの Email Sending: Edit だけの API トークン(Staging 用。本番とは分ける)。
# 手元の .env.workers-staging.local の CF_EMAIL_SMTP_TOKEN_STAGING を環境変数で渡して push する
enabled = true
host = "smtp.mx.cloudflare.net"
port = 465
user = "api_token"
pass = "env(CF_EMAIL_SMTP_TOKEN_STAGING)"
admin_email = "no-reply@samasama.site"
sender_name = "明日もsamasama"

[auth.email.template.magic_link]
subject = "明日もsamasama のログインコード / Sign-in code"
content_path = "./supabase/templates/login-code.html"

[auth.email.template.confirmation]
subject = "明日もsamasama のログインコード / Sign-in code"
content_path = "./supabase/templates/login-code.html"

[auth.email.template.email_change]
# v1 の件名と文面が残っていたので、コードだけの文面にする。画面は updateUser({ email }) → verifyOtp(type=email_change)
subject = "明日もsamasama のメールアドレス変更のコード / Code to change your email"
content_path = "./supabase/templates/email-change-code.html"

[auth.email.notification.email_changed]
enabled = true
subject = "明日もsamasama のメールアドレスが変わりました / Your sign-in email was changed"
content_path = "./supabase/templates/email-changed-notification.html"

[auth.external.google]
# 「Google で続ける」(2026-11-10)。GCP のプロジェクト samasama-app の OAuth クライアント samasama-app-staging。
# 同意画面はテスト中で、入れるのはテストユーザーに足した人だけ。クライアント ID は秘密ではないので直接書く。
# シークレットは手元の .env.workers-staging.local の GOOGLE_OAUTH_CLIENT_SECRET を環境変数で渡して push する
enabled = true
client_id = "493145134511-fkfmfdr4pcpjgota0o1550h7pbvaihkm.apps.googleusercontent.com"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[auth.sms]
# 個人の支え手の電話番号の確認(2026-11-12 定例で Twilio に決定)。画面は updateUser({ phone }) → verifyOtp(type=phone_change)。
# コードは Twilio Verify が作って送る(6 けた。文面の名前は Verify の Service の Friendly name「明日もsamasama」)。
# enabled は電話の入口そのものの有効化で、切ると電話番号の確認も動かない。
# 確認済みの電話番号では SMS のコードでログインもできる(メールが使えなくなった個人の支え手の入口、#155)。
# 電話番号での新規登録は画面が shouldCreateUser: false で断る
enabled = true
enable_confirmations = true

[auth.sms.twilio_verify]
# Twilio のアカウント「My First Twilio Account」(代表が作成、岡本は Administrator)の Verify の Service「明日もsamasama」。
# リポは公開で、GitHub の push 保護が Account SID を止めるので、SID も Auth Token も手元の .env.workers-staging.local から環境変数で渡して push する
# (TWILIO_ACCOUNT_SID・TWILIO_VERIFY_SERVICE_SID・TWILIO_AUTH_TOKEN)
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_VERIFY_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
