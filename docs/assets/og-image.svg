<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'IPAPGothic','IPAGothic',sans-serif">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FCF6"/>
      <stop offset="0.55" stop-color="#F3FAFF"/>
      <stop offset="1" stop-color="#FFF6DE"/>
    </linearGradient>
    <linearGradient id="ogTear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0BC5A4"/>
      <stop offset="100%" stop-color="#0A8FD4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <circle cx="1105" cy="95" r="150" fill="#FFE9A8" opacity="0.30"/>
  <circle cx="90" cy="590" r="130" fill="#BDEFFB" opacity="0.35"/>

  <!-- ブランド行(ロゴマーク + サービス名) -->
  <g transform="translate(100,88)">
    <path transform="scale(1.05)" d="M24 2C24 2 9 17 9 27.7C9 36.1 15.8 39.3 24 39.3C32.2 39.3 39 36.1 39 27.7C39 17 24 2 24 2Z" fill="url(#ogTear)"/>
    <circle cx="25.2" cy="30" r="5.6" fill="#FFFBEA"/>
    <text x="58" y="33" font-size="34" font-weight="bold" fill="#0D9488" stroke="#0D9488" stroke-width="0.8">明日もsamasama｜SDGs MATCH</text>
  </g>

  <!-- メインコピー -->
  <text x="100" y="272" font-size="76" fill="#0F172A" stroke="#0F172A" stroke-width="2.6">ひとりで悩まない、</text>
  <text x="100" y="376" font-size="76" fill="#0D9488" stroke="#0D9488" stroke-width="2.6">支援への入り口。</text>

  <!-- サブコピー -->
  <text x="100" y="452" font-size="34" fill="#475569">困りごとを話すだけ。AIが内容を整理して、</text>
  <text x="100" y="500" font-size="34" fill="#475569">支援できる団体・行政・企業へつなぎます。</text>

  <!-- 対応言語チップ -->
  <g font-size="24" fill="#0D9488">
    <rect x="100" y="532" width="270" height="42" rx="21" fill="#FFFFFF" stroke="#BFE9DC" stroke-width="2"/>
    <text x="122" y="561">日本語・English・中文</text>
  </g>

  <!-- なみあ(右) -->
  <ellipse cx="985" cy="586" rx="150" ry="22" fill="#0A8FD4" opacity="0.12"/>
  <g transform="translate(795,118) scale(0.79)">

  
  
  <defs>
    <linearGradient id="nBody" x1="150" y1="90" x2="340" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="0.42" stop-color="#21A5E2"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <radialGradient id="nBelly" cx="46%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFBEA"/>
      <stop offset="1" stop-color="#FFEDB8"/>
    </radialGradient>
    <radialGradient id="nGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 上げた手（向かって左）: 体の後ろに配置 -->
  <path d="M116 456 C76 446 44 406 46 362 C47 338 62 322 82 328 C100 334 110 354 112 376 C114 400 122 428 134 444 Z"
    fill="url(#nBody)" stroke="#1467A8" stroke-width="9" stroke-linejoin="round"/>

  <!-- 体（涙型） -->
  <path d="M240 70 C240 70 92 252 92 416 C92 522 158 572 240 572 C322 572 388 522 388 416 C388 252 240 70 240 70 Z"
    fill="url(#nBody)" stroke="#1467A8" stroke-width="9" stroke-linejoin="round"/>

  <!-- 足 -->
  <path d="M178 566 c0 -8 12 -14 26 -14 s26 6 26 14 v22 c0 9 -11 16 -26 16 s-26 -7 -26 -16 Z" fill="#1E96DC" stroke="#1467A8" stroke-width="8" stroke-linejoin="round"/>
  <path d="M250 566 c0 -8 12 -14 26 -14 s26 6 26 14 v22 c0 9 -11 16 -26 16 s-26 -7 -26 -16 Z" fill="#1E96DC" stroke="#1467A8" stroke-width="8" stroke-linejoin="round"/>

  <!-- 体のハイライト -->
  <path d="M198 134 C170 174 150 212 142 248" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity="0.28"/>

  <!-- みちあかり（おなかの丸い光） -->
  <circle cx="240" cy="456" r="96" fill="url(#nGlow)"/>
  <circle cx="240" cy="456" r="63" fill="url(#nBelly)"/>

  <!-- 添えた手（向かって右） -->
  <path d="M366 428 C392 442 400 470 385 488 C370 505 342 502 327 487 C316 476 312 463 317 451 C324 435 347 418 366 428 Z"
    fill="url(#nBody)" stroke="#1467A8" stroke-width="9" stroke-linejoin="round"/>

  <!-- 顔 -->
  <path d="M158 264 q22 -18 46 -11" fill="none" stroke="#0E3A5E" stroke-width="7" stroke-linecap="round"/>
  <path d="M276 253 q24 -7 46 11" fill="none" stroke="#0E3A5E" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="185" cy="304" rx="17" ry="24" fill="#0F1B2D"/>
  <ellipse cx="295" cy="304" rx="17" ry="24" fill="#0F1B2D"/>
  <circle cx="192" cy="293" r="6" fill="#FFFFFF"/>
  <circle cx="179" cy="311" r="2.8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="302" cy="293" r="6" fill="#FFFFFF"/>
  <circle cx="289" cy="311" r="2.8" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="143" cy="345" rx="19" ry="11" fill="#A9DFF6" opacity="0.85"/>
  <ellipse cx="337" cy="345" rx="19" ry="11" fill="#A9DFF6" opacity="0.85"/>
  <path d="M212 352 q28 26 56 0" fill="none" stroke="#0D2B47" stroke-width="9" stroke-linecap="round"/>

  <!-- みちあかりの粒（上げた手のまわり／おなかの横） -->
  <circle cx="56" cy="268" r="7" fill="#FFD666"/>
  <circle cx="86" cy="246" r="4.5" fill="#FFD666"/>
  <circle cx="44" cy="302" r="4" fill="#FFE9A8"/>
  <circle cx="94" cy="288" r="3" fill="#FFE9A8"/>
  <circle cx="324" cy="472" r="6" fill="#FFD666"/>
  <circle cx="344" cy="452" r="4" fill="#FFD666"/>
  <circle cx="354" cy="488" r="3.5" fill="#FFE9A8"/>
  <circle cx="370" cy="470" r="2.5" fill="#FFE9A8"/>

  </g>
</svg>