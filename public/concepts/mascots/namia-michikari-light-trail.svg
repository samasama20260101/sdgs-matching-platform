<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Michiakari light trail</title>
  <desc id="desc">A warm dotted light trail used as Namia's michiakari effect.</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.74 0 0 0.55  0 0 0.2 0 0  0 0 0 0.75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="trail" x1="99" y1="236" x2="1090" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd55e"/>
      <stop offset="0.5" stop-color="#fff4b8"/>
      <stop offset="1" stop-color="#ffd55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="none"/>
  <path d="M94 235C257 314 392 291 520 201c139-98 294-129 585-75" fill="none" stroke="url(#trail)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 33" filter="url(#softGlow)"/>
  <g fill="#ffd55e" filter="url(#softGlow)">
    <circle cx="88" cy="231" r="24"/>
    <circle cx="274" cy="296" r="13"/>
    <circle cx="435" cy="251" r="18"/>
    <circle cx="617" cy="163" r="15"/>
    <circle cx="782" cy="126" r="21"/>
    <circle cx="961" cy="111" r="14"/>
    <circle cx="1112" cy="129" r="23"/>
  </g>
  <g fill="#fff7c5" opacity="0.95">
    <circle cx="181" cy="272" r="7"/>
    <circle cx="354" cy="287" r="8"/>
    <circle cx="544" cy="183" r="7"/>
    <circle cx="703" cy="135" r="8"/>
    <circle cx="875" cy="112" r="7"/>
    <circle cx="1048" cy="117" r="8"/>
  </g>
</svg>
