<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="t d">
  <title id="t">なみあ 名刺のすみ素材</title>
  <desc id="d">名刺・スライド・案内カードの余白から、なみあがひょっこりのぞく小さめ素材。</desc>
  <defs>
    <linearGradient id="ccBody" x1="150" y1="40" x2="290" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="0.5" stop-color="#21A5E2"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <linearGradient id="ccEdge" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <clipPath id="ccClip">
      <rect x="0" y="0" width="420" height="268"/>
    </clipPath>
  </defs>

  <!-- のぞいている体（フチ線から上だけ見える） -->
  <g clip-path="url(#ccClip)">
    <path d="M210 34 C210 34 92 180 92 312 C92 396 144 436 210 436 C276 436 328 396 328 312 C328 180 210 34 210 34 Z"
      fill="url(#ccBody)" stroke="#1467A8" stroke-width="9" stroke-linejoin="round"/>
    <path d="M176 86 C154 118 138 148 130 176" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.28"/>

    <!-- 顔（フチの上でこちらを見る） -->
    <path d="M138 172 q18 -14 38 -9" fill="none" stroke="#0E3A5E" stroke-width="6" stroke-linecap="round"/>
    <path d="M240 163 q20 -5 38 9" fill="none" stroke="#0E3A5E" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="166" cy="206" rx="15" ry="21" fill="#0F1B2D"/>
    <ellipse cx="262" cy="206" rx="15" ry="21" fill="#0F1B2D"/>
    <circle cx="172" cy="196" r="5" fill="#FFFFFF"/>
    <circle cx="268" cy="196" r="5" fill="#FFFFFF"/>
    <ellipse cx="128" cy="240" rx="16" ry="9" fill="#A9DFF6" opacity="0.85"/>
    <ellipse cx="300" cy="240" rx="16" ry="9" fill="#A9DFF6" opacity="0.85"/>
    <path d="M192 246 q22 18 44 0" fill="none" stroke="#0D2B47" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- つかまっている手（フチの上） -->
  <path d="M118 268 a20 18 0 0 1 40 0" fill="#21A5E2" stroke="#1467A8" stroke-width="8" stroke-linejoin="round"/>
  <path d="M262 268 a20 18 0 0 1 40 0" fill="#21A5E2" stroke="#1467A8" stroke-width="8" stroke-linejoin="round"/>

  <!-- フチ線（名刺の縁を想定したブランドライン） -->
  <rect x="12" y="264" width="396" height="12" rx="6" fill="url(#ccEdge)"/>

  <!-- みちあかりの粒 -->
  <circle cx="330" cy="120" r="6" fill="#FFD666"/>
  <circle cx="352" cy="96" r="4" fill="#FFD666"/>
  <circle cx="344" cy="150" r="3" fill="#FFE9A8"/>
</svg>
