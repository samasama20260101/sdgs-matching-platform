<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Namia speech bubble template</title>
  <desc id="desc">A social and flyer template with Namia and a message bubble.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8fff9"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7d9"/>
    </linearGradient>
    <linearGradient id="namia" x1="190" y1="126" x2="372" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20d6c3"/>
      <stop offset="1" stop-color="#1094d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a8fd4" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M284 94c91 104 154 191 154 282 0 95-64 149-154 149s-154-54-154-149c0-91 63-178 154-282z" fill="url(#namia)" stroke="#0876a7" stroke-width="9"/>
    <circle cx="235" cy="302" r="19" fill="#071d3f"/>
    <circle cx="331" cy="302" r="19" fill="#071d3f"/>
    <circle cx="242" cy="294" r="7" fill="#fff"/>
    <circle cx="338" cy="294" r="7" fill="#fff"/>
    <path d="M254 362c21 22 47 22 68 0" fill="none" stroke="#08213a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="284" cy="432" r="48" fill="#f4feff" stroke="#ffe8a5" stroke-width="7" filter="url(#glow)"/>
  </g>
  <path d="M529 114h456c58 0 105 47 105 105v151c0 58-47 105-105 105H702l-107 82 26-82h-92c-58 0-105-47-105-105V219c0-58 47-105 105-105z" fill="#fff" stroke="#bdeee8" stroke-width="8"/>
  <text x="565" y="249" fill="#0f2b3f" font-family="sans-serif" font-size="50" font-weight="800">ひとりで</text>
  <text x="565" y="322" fill="#0f2b3f" font-family="sans-serif" font-size="50" font-weight="800">抱えこまないで。</text>
  <text x="568" y="392" fill="#35606e" font-family="sans-serif" font-size="27">声にならない気持ちにも、道はある。</text>
  <text x="565" y="515" fill="#0d9c9a" font-family="sans-serif" font-size="26" font-weight="700">明日もsamasama / なみあ</text>
</svg>
