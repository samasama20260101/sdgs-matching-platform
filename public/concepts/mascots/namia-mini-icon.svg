  <circle cx="332" cy="236" r="7" fill="#fff"/>
  <path d="M214 308c24 28 60 28 84 0" fill="none" stroke="#08213a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="371" r="54" fill="url(#light)" filter="url(#glow)"/>
