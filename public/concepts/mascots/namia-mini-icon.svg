<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">なみあ ミニアイコン</title>
  <desc id="d">SNSアイコンや資料の角に置ける、なみあの簡略版。涙型の体とみちあかり。</desc>
  <defs>
    <linearGradient id="mBody" x1="170" y1="60" x2="330" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="0.42" stop-color="#21A5E2"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <radialGradient id="mBelly" cx="46%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFBEA"/>
      <stop offset="1" stop-color="#FFEDB8"/>
    </radialGradient>
    <radialGradient id="mGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 体（涙型） -->
  <path d="M256 44 C256 44 122 208 122 356 C122 452 182 498 256 498 C330 498 390 452 390 356 C390 208 256 44 256 44 Z"
    fill="url(#mBody)" stroke="#1467A8" stroke-width="10" stroke-linejoin="round"/>

  <!-- ハイライト -->
  <path d="M218 102 C194 138 176 172 168 204" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.28"/>

  <!-- みちあかり -->
  <circle cx="256" cy="392" r="84" fill="url(#mGlow)"/>
  <circle cx="256" cy="392" r="56" fill="url(#mBelly)"/>

  <!-- 顔 -->
  <path d="M164 218 q20 -16 42 -10" fill="none" stroke="#0E3A5E" stroke-width="7" stroke-linecap="round"/>
  <path d="M306 208 q22 -6 42 10" fill="none" stroke="#0E3A5E" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="196" cy="256" rx="16" ry="23" fill="#0F1B2D"/>
  <ellipse cx="316" cy="256" rx="16" ry="23" fill="#0F1B2D"/>
  <circle cx="203" cy="245" r="5.5" fill="#FFFFFF"/>
  <circle cx="190" cy="262" r="2.6" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="323" cy="245" r="5.5" fill="#FFFFFF"/>
  <circle cx="310" cy="262" r="2.6" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="158" cy="294" rx="17" ry="10" fill="#A9DFF6" opacity="0.85"/>
  <ellipse cx="354" cy="294" rx="17" ry="10" fill="#A9DFF6" opacity="0.85"/>
  <path d="M230 300 q26 24 52 0" fill="none" stroke="#0D2B47" stroke-width="9" stroke-linecap="round"/>

  <!-- みちあかりの粒 -->
  <circle cx="352" cy="418" r="6" fill="#FFD666"/>
  <circle cx="372" cy="398" r="4" fill="#FFD666"/>
  <circle cx="380" cy="432" r="3" fill="#FFE9A8"/>
</svg>
