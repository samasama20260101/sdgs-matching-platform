<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">なみあ SNSカード（ミニ）</title>
  <desc id="d">告知内容やコピーを主役にする1200x630のSNSカードテンプレート。なみあはミニアイコンで添える。</desc>
  <defs>
    <linearGradient id="scmEdge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <linearGradient id="scmBody" x1="1000" y1="420" x2="1110" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="0.42" stop-color="#21A5E2"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <radialGradient id="scmBelly" cx="46%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFBEA"/>
      <stop offset="1" stop-color="#FFEDB8"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="14" fill="url(#scmEdge)"/>
  <rect x="0" y="616" width="1200" height="14" fill="url(#scmEdge)"/>

  <!-- ブランドチップ -->
  <text x="72" y="104" font-size="26" font-weight="700" fill="#0D9488">明日もsamasama｜SDGs MATCH</text>

  <!-- 差し替え用テキスト -->
  <text x="72" y="240" font-size="68" font-weight="800" fill="#94A3B8">ここに告知タイトル</text>
  <text x="72" y="330" font-size="36" fill="#94A3B8">日時・場所・対象などの情報をこの行に入れます。</text>
  <rect x="72" y="384" width="760" height="18" rx="9" fill="#EDF2F7"/>
  <rect x="72" y="424" width="680" height="18" rx="9" fill="#EDF2F7"/>
  <rect x="72" y="464" width="720" height="18" rx="9" fill="#EDF2F7"/>

  <text x="72" y="566" font-size="28" font-weight="700" fill="#0D9488">#みちあかり　#明日もsamasama</text>

  <!-- ミニなみあ（右下・記憶点） -->
  <g transform="translate(970,346) scale(0.46)">
