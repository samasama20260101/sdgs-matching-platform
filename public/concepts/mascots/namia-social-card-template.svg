<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Namia social card template</title>
  <desc id="desc">A social card style image for Namia awareness posts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#062033"/>
      <stop offset="0.58" stop-color="#0c5368"/>
      <stop offset="1" stop-color="#12a8a0"/>
    </linearGradient>
    <linearGradient id="drop" x1="746" y1="99" x2="984" y2="521" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22dcc7"/>
      <stop offset="1" stop-color="#1194d2"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#00131f" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="106" cy="106" r="170" fill="#ffffff" opacity="0.05"/>
  <circle cx="1074" cy="528" r="220" fill="#fff4b0" opacity="0.12"/>
  <g filter="url(#soft)">
    <path d="M862 86c95 109 164 206 164 305 0 99-69 156-164 156s-164-57-164-156c0-99 69-196 164-305z" fill="url(#drop)" stroke="#7de6ee" stroke-width="8"/>
    <ellipse cx="808" cy="313" rx="19" ry="28" fill="#061c35"/>
    <ellipse cx="915" cy="313" rx="19" ry="28" fill="#061c35"/>
    <circle cx="815" cy="304" r="7" fill="#fff"/>
    <circle cx="922" cy="304" r="7" fill="#fff"/>
    <path d="M829 373c25 27 60 27 85 0" fill="none" stroke="#061c35" stroke-width="11" stroke-linecap="round"/>
    <circle cx="862" cy="450" r="52" fill="#f3ffff" stroke="#ffe7a2" stroke-width="8" filter="url(#glow)"/>
  </g>
  <text x="92" y="167" fill="#b7fff3" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="6">NAMIA / MICHIAKARI</text>
  <text x="88" y="275" fill="#ffffff" font-family="sans-serif" font-size="68" font-weight="900">声にならない気持ちにも、</text>
  <text x="88" y="364" fill="#ffffff" font-family="sans-serif" font-size="68" font-weight="900">道はある。</text>
  <text x="94" y="442" fill="#d7fdf7" font-family="sans-serif" font-size="31">なみあは、相談につながる最初の灯です。</text>
  <text x="94" y="532" fill="#ffe6a6" font-family="sans-serif" font-size="28" font-weight="800">明日もsamasama | SDGs MATCH</text>
</svg>
