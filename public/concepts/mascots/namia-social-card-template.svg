<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Namia social card template - standard icon</title>
  <desc id="desc">A social card template using the standard Namia character for awareness posts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#062033"/>
      <stop offset="0.58" stop-color="#0c5368"/>
      <stop offset="1" stop-color="#12a8a0"/>
    </linearGradient>
    <linearGradient id="drop" x1="740" y1="74" x2="992" y2="556" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27dbc8"/>
      <stop offset="1" stop-color="#1094d2"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="48%" r="58%">
      <stop stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f3ffff"/>
      <stop offset="1" stop-color="#ffe39a"/>
    </radialGradient>
    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#00131f" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="106" cy="106" r="170" fill="#ffffff" opacity="0.05"/>
  <circle cx="1074" cy="528" r="220" fill="#fff4b0" opacity="0.12"/>
  <path d="M676 542c112-48 224-61 360-34" fill="none" stroke="#fff0a3" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
  <g filter="url(#soft)">
    <path d="M866 74c96 110 166 208 166 308 0 101-70 159-166 159s-166-58-166-159c0-100 70-198 166-308z" fill="url(#drop)" stroke="#7de6ee" stroke-width="8" stroke-linejoin="round"/>
    <path d="M762 285c-31 11-50 39-47 70 3 33 28 58 61 64" fill="none" stroke="#7de6ee" stroke-width="10" stroke-linecap="round"/>
    <path d="M970 285c31 11 50 39 47 70-3 33-28 58-61 64" fill="none" stroke="#7de6ee" stroke-width="10" stroke-linecap="round"/>
    <path d="M763 257c13-16 32-23 53-21" fill="none" stroke="#7de6ee" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
    <path d="M916 236c21-2 40 5 53 21" fill="none" stroke="#7de6ee" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
    <ellipse cx="807" cy="314" rx="18" ry="27" fill="#061c35"/>
    <ellipse cx="925" cy="314" rx="18" ry="27" fill="#061c35"/>
    <circle cx="814" cy="304" r="6.5" fill="#ffffff"/>
    <circle cx="932" cy="304" r="6.5" fill="#ffffff"/>
    <path d="M831 374c24 26 46 26 70 0" fill="none" stroke="#061c35" stroke-width="11" stroke-linecap="round"/>
    <circle cx="866" cy="453" r="52" fill="url(#light)" filter="url(#glow)"/>
    <path d="M805 541c-7 22 2 36 28 38h18" fill="none" stroke="#7de6ee" stroke-width="10" stroke-linecap="round"/>
    <path d="M927 541c7 22-2 36-28 38h-18" fill="none" stroke="#7de6ee" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="92" y="167" fill="#b7fff3" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="6">NAMIA / MICHIAKARI</text>
  <text x="88" y="275" fill="#ffffff" font-family="sans-serif" font-size="68" font-weight="900">声にならない気持ちにも、</text>
  <text x="88" y="364" fill="#ffffff" font-family="sans-serif" font-size="68" font-weight="900">道はある。</text>
  <text x="94" y="442" fill="#d7fdf7" font-family="sans-serif" font-size="31">なみあは、相談につながる最初の灯です。</text>
  <text x="94" y="532" fill="#ffe6a6" font-family="sans-serif" font-size="28" font-weight="800">明日もsamasama | SDGs MATCH</text>
</svg>
