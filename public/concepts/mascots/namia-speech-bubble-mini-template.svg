<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">なみあ 吹き出しテンプレート（ミニ）</title>
  <desc id="d">ミニアイコン版の吹き出しテンプレート。コピーや案内文を主役にしたい紙面向け。</desc>
  <defs>
    <linearGradient id="smBody" x1="80" y1="380" x2="180" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36D6AE"/>
      <stop offset="0.42" stop-color="#21A5E2"/>
      <stop offset="1" stop-color="#1180CF"/>
    </linearGradient>
    <radialGradient id="smBelly" cx="46%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFBEA"/>
      <stop offset="1" stop-color="#FFEDB8"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="582" rx="36" fill="#FBFFFE" stroke="#E2F4EC" stroke-width="3"/>

  <!-- 吹き出し（大・テキスト主役） -->
  <path d="M120 92 h960 a44 44 0 0 1 44 44 v250 a44 44 0 0 1 -44 44 h-830 l-72 74 8 -74 h-66 a44 44 0 0 1 -44 -44 v-250 a44 44 0 0 1 44 -44 Z"
    fill="#FFFFFF" stroke="#BFE9DC" stroke-width="4" stroke-linejoin="round"/>

  <!-- 差し替え用テキスト -->
  <text x="600" y="212" text-anchor="middle" font-size="54" font-weight="700" fill="#94A3B8">ここにメインコピーを入れてください</text>
  <text x="600" y="292" text-anchor="middle" font-size="32" fill="#94A3B8">説明文や案内文はこの行に。2行までを目安に。</text>
  <text x="600" y="368" text-anchor="middle" font-size="28" fill="#0D9488">例：こまったら、まず はなしてみよう。</text>

  <!-- ミニなみあ（左下・記憶点） -->
  <g transform="translate(64,368) scale(0.42)">
    <path d="M256 44 C256 44 122 208 122 356 C122 452 182 498 256 498 C330 498 390 452 390 356 C390 208 256 44 256 44 Z"
      fill="url(#smBody)" stroke="#1467A8" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="256" cy="392" r="56" fill="url(#smBelly)"/>
    <ellipse cx="196" cy="256" rx="16" ry="23" fill="#0F1B2D"/>
    <ellipse cx="316" cy="256" rx="16" ry="23" fill="#0F1B2D"/>
    <circle cx="203" cy="245" r="5.5" fill="#FFFFFF"/>
    <circle cx="323" cy="245" r="5.5" fill="#FFFFFF"/>
    <ellipse cx="158" cy="294" rx="17" ry="10" fill="#A9DFF6" opacity="0.85"/>
    <ellipse cx="354" cy="294" rx="17" ry="10" fill="#A9DFF6" opacity="0.85"/>
    <path d="M230 300 q26 24 52 0" fill="none" stroke="#0D2B47" stroke-width="9" stroke-linecap="round"/>
    <circle cx="352" cy="418" r="6" fill="#FFD666"/>
    <circle cx="372" cy="398" r="4" fill="#FFD666"/>
  </g>

  <!-- ブランドフッター -->
  <text x="1120" y="566" text-anchor="end" font-size="24" font-weight="700" fill="#64748B">明日もsamasama｜SDGs MATCH</text>
</svg>
