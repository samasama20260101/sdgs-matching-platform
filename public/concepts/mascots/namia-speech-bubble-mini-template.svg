<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Namia speech bubble template - mini icon</title>
  <desc id="desc">A speech bubble template using the Namia mini icon for compact awareness posts and flyers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1fffb"/>
      <stop offset="0.56" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff8df"/>
    </linearGradient>
    <linearGradient id="body" x1="132" y1="114" x2="302" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26dbc8"/>
      <stop offset="1" stop-color="#1094d2"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="48%" r="58%">
      <stop stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f3ffff"/>
      <stop offset="1" stop-color="#ffe39a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="165%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0a8fd4" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="205" cy="314" r="176" fill="#e7fff9"/>
  <circle cx="1014" cy="523" r="150" fill="#fff0a3" opacity="0.34"/>
  <g filter="url(#shadow)">
    <path d="M210 100c72 83 129 162 129 247 0 80-55 125-129 125S81 427 81 347c0-85 57-164 129-247z" fill="url(#body)" stroke="#0876a7" stroke-width="8" stroke-linejoin="round"/>
    <path d="M128 253c11-13 25-20 42-19" fill="none" stroke="#0a6e9b" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <path d="M250 234c17-1 31 6 42 19" fill="none" stroke="#0a6e9b" stroke-width="6" stroke-linecap="round" opacity="0.62"/>
    <ellipse cx="149" cy="277" rx="16" ry="23" fill="#071d3f"/>
    <ellipse cx="271" cy="277" rx="16" ry="23" fill="#071d3f"/>
    <circle cx="155" cy="267" r="5.8" fill="#ffffff"/>
    <circle cx="277" cy="267" r="5.8" fill="#ffffff"/>
    <path d="M174 333c21 22 51 22 72 0" fill="none" stroke="#08213a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="210" cy="390" r="46" fill="url(#light)" filter="url(#glow)"/>
  </g>
  <path d="M425 103h515c64 0 116 52 116 116v150c0 64-52 116-116 116H651l-116 86 28-86H425c-64 0-116-52-116-116V219c0-64 52-116 116-116z" fill="#ffffff" stroke="#bdeee8" stroke-width="8"/>
  <text x="468" y="246" fill="#0f2b3f" font-family="sans-serif" font-size="52" font-weight="800">ひとりで</text>
  <text x="468" y="321" fill="#0f2b3f" font-family="sans-serif" font-size="52" font-weight="800">抱えこまないで。</text>
  <text x="470" y="394" fill="#35606e" font-family="sans-serif" font-size="28">声にならない気持ちにも、道はある。</text>
  <text x="468" y="520" fill="#0d9c9a" font-family="sans-serif" font-size="26" font-weight="700">明日もsamasama / なみあ</text>
</svg>
